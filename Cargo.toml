[package]
name = "treichville-exchange"
version = "0.1.0"
edition = "2021"
authors = ["Treichville Exchange Team"]
description = "High-performance digital exchange platform for West Africa"

[dependencies]
# Web Framework
axum = { version = "0.7", features = ["ws", "macros", "json", "query", "multipart"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tokio = { version = "1", features = ["full","tracing"] }
tower = { version = "0.4", features = ["timeout", "limit", "load-shed"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "request-id", "sensitive-headers", "limit"] }
lazy_static = "1.4"
prometheus = { version = "0.13", features = ["process"] }

# Tokio console (for debugging)
console-subscriber = "0.1.5"


# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "rust_decimal", "migrate","macros"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager", "ahash"] }

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_with = "3.4"

# Auth & Security
jsonwebtoken = "9"
argon2 = "0.4"
uuid = { version = "1.6", features = ["v4", "serde", "fast-rng"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.13"

# Validation
validator = { version = "0.16", features = ["derive"] }
regex = "1.10"
once_cell = "1.19"

# HTTP Client (Binance API)
reqwest = { version = "0.11", features = ["json", "rustls-tls", "gzip", "trust-dns"] }

# WebSocket
tokio-tungstenite = "0.24"
futures-util = "0.3"
futures = "0.3"

# Time
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.8"

# Environment
dotenvy = "0.15"
config = "0.13"

# Logging & Monitoring
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "ansi"] }
tracing-opentelemetry = "0.22"
opentelemetry = { version = "0.21", features = ["trace"] }
opentelemetry-otlp = "0.14"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Decimal for money (CRITICAL)
rust_decimal = { version = "1.33", features = ["serde", "db-postgres", "maths"] }
rust_decimal_macros = "1.33"

# Rate Limiting
governor = "0.6"
nonzero_ext = "0.3"

# Async traits
async-trait = "0.1"





[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
fake = "2.9"
rstest = "0.18"
mockall = "0.12"
wiremock = "0.5"
futures = "0.3"
pretty_assertions = "1.4"



[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 2